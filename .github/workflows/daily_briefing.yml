name: Daily Morning Briefing

on:
  schedule:
    # 13:00 UTC = 8:00 AM EST (winter) / 9:00 AM EDT (summer)
    # GitHub Actions cron doesn't adjust for DST — this keeps it close to 8am ET year-round
    - cron: '0 13 * * *'
  workflow_dispatch:          # lets you trigger it manually from GitHub Actions UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send morning briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RECIPIENT_NAME: ${{ secrets.RECIPIENT_NAME }}
        run: python briefing.py
